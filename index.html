    <script>
      // Automatically strip out any floating AI Studio watermarks or preview badges
      window.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver((mutations) => {
          document.querySelectorAll('div, span, a, iframe').forEach(el => {
            const txt = (el.textContent || '').trim();
            if ((txt.includes('AI Studio') || txt.includes('Google AI')) && (el.style.position === 'fixed' || el.style.position === 'absolute' || el.classList.value.includes('badge') || el.classList.value.includes('banner'))) {
              el.remove();
            }
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
